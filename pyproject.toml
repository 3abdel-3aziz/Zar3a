    "osmnx>=2.1.1",
    "paddleocr==2.9.1",
    "paddlepaddle==2.6.2",
    "pandas>=2.3.3",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.54",
    "tqdm>=4.70.1",
