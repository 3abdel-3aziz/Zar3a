# ---------------------------------------------------------------------------
# uv index & source overrides
# ---------------------------------------------------------------------------
# Route `torch` to the CPU-only PyTorch wheel index.
# The default PyPI index resolves torch to the CUDA 13 variant (~12 GB of
# NVIDIA libs) which cannot be used inside a standard Docker container anyway
# (no GPU runtime).  The CPU wheel is ~250 MB and functionally identical for
# inference workloads that don't need a physical GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = [".", "back_end", "back_end/src", "src"]

[tool.pyright]
extraPaths = [".", "back_end", "back_end/src", "src"]

[tool.pyrefly]
# Teach pyrefly where the back_end source packages live.
# back_end/src is the import root for: agent, api, climate_ml,
# rag_database, recommendation_system, and chunkers.
search_path = ["back_end/src", "back_end"]
