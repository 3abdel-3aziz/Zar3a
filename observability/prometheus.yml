global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Zar3a FastAPI backend ─────────────────────────────────────────────────
  # Requires the `prometheus-fastapi-instrumentator` package and the /metrics
  # endpoint to be mounted in api/main.py. If not yet added, this job will
  # simply fail to scrape gracefully until the endpoint is available.
  - job_name: "zar3a_backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
